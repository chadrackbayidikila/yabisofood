<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos YA BISO FOOD</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:14px;background:#fff6e5;color:#2a2118;line-height:1.4}
h2{margin:6px 0 4px}
.c{display:flex;gap:10px;background:#fff;border:1px solid #f0dfc4;border-radius:12px;padding:8px;margin-bottom:10px;align-items:flex-start}
.c img{width:96px;height:96px;object-fit:cover;border-radius:8px;background:#eee;flex:none}
.c div{flex:1;min-width:0}
.c small{display:block;color:#7b6b5a;word-break:break-all}
.w{color:#9b1c1c;font-weight:700}
select{width:100%;padding:10px;font-size:16px;margin-top:6px;border-radius:8px}
button{width:100%;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#e8590c;color:#fff;margin:10px 0}
textarea{width:100%;height:130px;font-size:13px;box-sizing:border-box}
.s{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.s img{width:44px;height:44px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>
<h2>📸 Photos → plats</h2>
<p>Pour chaque photo, choisis le plat qui correspond. Laisse « Aucun plat » pour ne pas l'utiliser.</p>
<div id="list">Chargement des photos…</div>
<button onclick="gen()">1. Générer la ligne</button>
<div id="warn" class="w"></div>
<textarea id="out" readonly placeholder="La ligne apparaîtra ici"></textarea>
<button onclick="cp()">2. Copier la ligne</button>
<div id="sum"></div>
<script>
var REPO="chadrackbayidikila/yabisofood";
var DISH={1:"Cuisse de poulet + bananes + riz",2:"Cuisse de poulet + bananes",3:"Cuisse de poulet + riz",4:"Cuisse de poulet + manioc",5:"Spaghettis + viande ou poulet",6:"Poulet mayo",7:"Riz composé",8:"Salade composée",9:"Yaourt",10:"Jus de bissap",11:"Jus de gingembre",12:"Bananes",13:"Frites"};
var KNOWN={"9cdfd3b2-bd1d-4adb-9b1d-4f431fb8ce7c.jpeg":1,"90030aca-7606-4421-b56d-fe7d94b72291.jpeg":4,"ee7a6bdb-0837-4d75-a4e1-8a8384af99d7.jpeg":5};
var files=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function render(){
 if(!files.length){$("list").textContent="Aucune photo trouvée dans le dépôt.";return}
 $("list").innerHTML=files.map(function(f,i){
  var kb=Math.round(f.size/1024),opts='<option value="">— Aucun plat —</option>';
  for(var id in DISH){opts+='<option value="'+id+'"'+(KNOWN[f.name]==id?' selected':'')+'>'+esc(DISH[id])+'</option>'}
  return '<div class="c"><img loading="lazy" src="'+esc(f.name)+'" alt=""><div><small>'+esc(f.name)+'</small><small'+(kb>800?' class="w"':'')+'>'+kb+' Ko'+(kb>800?' ⚠️ photo lourde':'')+'</small><select id="s'+i+'">'+opts+'</select></div></div>'}).join("");
}
function gen(){
 var map={},dup=[],i,v;
 for(i=0;i<files.length;i++){v=$("s"+i).value;if(!v)continue;if(map[v])dup.push(DISH[v]);map[v]=files[i].name}
 var keys=Object.keys(map).sort(function(a,b){return a-b});
 if(!keys.length){$("warn").textContent="Choisis au moins un plat.";$("out").value="";return}
 $("warn").textContent=dup.length?"⚠️ Plusieurs photos pour : "+dup.join(", ")+" (la dernière choisie sera utilisée)":"";
 $("out").value="var PH={"+keys.map(function(k){return k+':"'+map[k]+'"'}).join(",")+"};S.products.forEach(function(p){if(PH[p.id])p.img=PH[p.id]});";
 $("sum").innerHTML=keys.map(function(k){return '<div class="s"><img src="'+esc(map[k])+'" alt=""><span>'+esc(DISH[k])+'</span></div>'}).join("");
}
function cp(){
 var t=$("out");if(!t.value){$("warn").textContent="Appuie d'abord sur « Générer la ligne ».";return}
 var done=function(){$("warn").textContent="✅ Ligne copiée"};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(done,function(){old()})}else old();
 function old(){t.focus();t.select();t.setSelectionRange(0,99999);try{document.execCommand("copy");done()}catch(e){$("warn").textContent="Copie impossible : maintiens ton doigt sur le texte et choisis Copier."}}
}
fetch("https://api.github.com/repos/"+REPO+"/contents").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){
 files=a.filter(function(f){return f.type==="file"&&/\.(jpe?g|png|webp)$/i.test(f.name)});render()
}).catch(function(){$("list").textContent="Impossible de charger la liste des photos. Vérifie ta connexion puis recharge la page."});
</script>
</body>
</html>
